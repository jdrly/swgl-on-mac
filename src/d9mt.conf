# d9mt settings for SWGL on Mac (DXVK-style config, read via DXVK_CONFIG_FILE).
# Present in step with the display refresh, so the game loop runs at an even 60 Hz.
d3d9.presentInterval = 1
# 32-bit game: Metal's own buffer memory is not addressable from i386 code, so no
# direct write-only mapping, and the pre-profile pools 32-bit games ran on.
d9mt.writeOnlyDirect = False
d9mt.memoryProfile = unlimited
